      description: The indicator value.
      type: String
    - contextPath: Datalake.status.atom_type
      description: The indicator type as classified by Datalake (e.g. ip, domain, url, file, email).
      type: String
    - contextPath: Datalake.status.hashkey
      description: The Datalake unique identifier for this indicator.
      type: String
    - contextPath: Datalake.status.status
      description: Reputation of the indicator.
      type: String
    - contextPath: Datalake.status.found
      description: Whether the indicator was found in Datalake.
      type: Boolean
    - contextPath: Datalake.status.last_updated
      description: The date the indicator was last updated in Datalake.
      type: Date
    - contextPath: Datalake.status.system_first_seen
      description: The date the indicator was first seen in Datalake.
      type: Date
    - contextPath: Datalake.status.first_seen
      description: The date the indicator was first reported by a source.
      type: Date
    - contextPath: Datalake.status.scores
      description: Comma-separated Datalake risk scores per threat type (e.g. "hack:10, malware:0").
      type: String
    - contextPath: Datalake.status.formatted_scores
      description: Datalake risk scores per threat type, padded with '-' for missing types.
      type: Unknown
    - contextPath: Datalake.status.sources
      description: List of source IDs that reported the indicator in Datalake.
      type: String
    - contextPath: Datalake.status.tags
      description: Datalake tags associated with the indicator.
      type: String
    - contextPath: Datalake.status.threat_entities
      description: 'List of threat entities linked to the indicator (e.g. "Malware: Cobalt Strike").'
      type: String
    - contextPath: Datalake.status.description
      description: Human-readable summary of the indicator reputation and flagged categories.
      type: String
    - contextPath: Domain.Name
      description: The domain name.
      type: String
    - contextPath: DBotScore.Indicator
      description: The indicator that was tested.
      type: String
    - contextPath: DBotScore.Type
      description: The indicator type.
      type: String
    - contextPath: DBotScore.Vendor
