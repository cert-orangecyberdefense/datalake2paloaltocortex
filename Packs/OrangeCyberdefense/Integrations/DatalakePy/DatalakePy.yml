    description: Checks the reputation of a specific indicator given its Datalake hashkey.
  - name: submit_sightings
    arguments:
    - name: start_timestamp
      description: Start of the sighting observation period.
      required: true
    - name: end_timestamp
      description: End of the sighting observation period. Can be identical to start_timestamp.
      required: true
    - name: sighting_type
      description: Sighting type. If POSITIVE or NEGATIVE, threat_types becomes mandatory.
      required: true
      auto: PREDEFINED
      predefined:
      - POSITIVE
      - NEGATIVE
      - NEUTRAL
    - name: description_visibility
      description: Sighting description visibility (sighting is always public, description can be hidden). Defaults to ORGANIZATION.
      auto: PREDEFINED
      predefined:
      - ORGANIZATION
      - PUBLIC
    - name: visibility
      description: Deprecated. Use description_visibility instead.
      deprecated: true
    - name: threat_types
      description: Datalake threat types for this sighting.
      auto: PREDEFINED
      predefined:
      - DDOS
      - FRAUD
      - HACK
      - LEAK
      - MALWARE
      - PHISHING
      - SCAM
      - SCAN
      - SPAM
    - name: atoms
      description: List of indicators for this sighting.
      required: true
    - name: atoms_type
      description: List of indicator types for this sighting. Must match the number of atoms.
      required: true
      auto: PREDEFINED
      predefined:
      - FileAtom
      - IpAtom
      - EmailAtom
      - UrlAtom
      - DomainAtom
      isArray: true
    - name: count
      description: Number of time the indicators where observed over the time period.
      defaultValue: "1"
    - name: tags
      description: Datalake tags for this sighting.
    - name: description
      description: Description for this sighting. Will be public or restricted to an organization depending on the value of "description_visibility".
    - name: impersonate_id
      description: Datalake Organization ID to impersonate.
    - name: impersonateID
      description: Deprecated. Use impersonate_id instead.
      deprecated: true
    outputs:
    - contextPath: Datalake.Sighting.uid
      description: The unique identifier of the sighting.
      type: String
    - contextPath: Datalake.Sighting.type
      description: The sighting type (positive, negative, or neutral).
      type: String
    - contextPath: Datalake.Sighting.count
      description: Number of times the indicators were observed over the time period.
      type: Number
    - contextPath: Datalake.Sighting.start_timestamp
      description: Start of the sighting observation period.
      type: Date
    - contextPath: Datalake.Sighting.end_timestamp
      description: End of the sighting observation period.
      type: Date
    - contextPath: Datalake.Sighting.timestamp_created
      description: The date the sighting was created in Datalake.
      type: Date
    - contextPath: Datalake.Sighting.description_visibility
      description: Visibility of the sighting description (PUBLIC or ORGANIZATION).
      type: String
    - contextPath: Datalake.Sighting.reliability
      description: Reliability score of the sighting source.
      type: Number
    - contextPath: Datalake.Sighting.relation_type
      description: The relation type of the sighting.
      type: String
    - contextPath: Datalake.Sighting.sighting_version
      description: Version of the sighting format.
