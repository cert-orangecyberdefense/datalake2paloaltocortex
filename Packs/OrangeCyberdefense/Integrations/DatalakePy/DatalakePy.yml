commonfields:
  id: Orange Cyberdefense Threat Intelligence (Datalake) V3
  version: -1
name: Orange Cyberdefense Threat Intelligence (Datalake) V3
display: Orange Cyberdefense Threat Intelligence (Datalake) V3
category: Data Enrichment & Threat Intelligence
fromversion: 6.10.0
description: Powered by Orange Cyberdefense Datalake platform, this threat intelligence integration provides insights on IP addresses, domains and various other indicators for threat investigations.
configuration:
- display: Datalake Environment
  name: datalakeEnv
  type: 15
  required: true
  options:
  - preprod
  - prod
  defaultvalue: prod
  section: Connect
- display: Datalake Long Term Token
  additionalinfo: You can generate one from Datalake on the "My Account" page.
  name: longtermToken
  type: 4
  required: true
  section: Connect
- display: Trust any certificate (not secure)
  additionalinfo: Disable SSL/TLS certificate validation when enabled.
  name: insecure
  type: 8
  required: false
  section: Connect
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  section: Connect
- display: Threshold Suspicious
  name: thresholdSuspicious
  defaultvalue: 30
  type: 0
  required: false
  section: Collect
- display: Threshold Malicious
  name: thresholdMalicious
  defaultvalue: 50
  type: 0
  required: false
  section: Collect
- display: Fetch indicators
  name: feed
  type: 8
  required: false
  defaultvalue: 'false'
  section: Collect
- display: Datalake queries
  name: queryHash
  additionalinfo: Build your own queries from the Datalake website then reference them here using query hashes to customize which indicators you import.
  defaultvalue: '{"dtl_query_malicious_domains":"d94d625114111e0bb2a2afaeab47b483","dtl_query_malicious_ips":"c879d177c513bee8fbc9586d6d2a231e"}'
  type: 0
  required: false
  section: Collect
- display: Feed Fetch Interval
  additionalinfo: How often Datalake indicators should be retrieved.
  name: feedFetchInterval
  type: 19
  required: false
  defaultvalue: "240"
  section: Collect
- display: Fetch Lookback (minutes)
  additionalinfo: How far back in time (in minutes) should it retrieve indicators.
  name: fetchLookback
  defaultvalue: 240
  type: 0
  required: true
  section: Collect
- display: ""
  name: feedExpirationInterval
  defaultvalue: "20160"
  type: 1
  required: false
  section: Collect
- display: ""
  name: feedExpirationPolicy
  defaultvalue: indicatorType
  type: 17
  options:
  - never
  - interval
  - indicatorType
  - suddenDeath
  required: false
  section: Collect
- display: Indicator Reputation
  name: feedReputation
  defaultvalue: feedInstanceReputationNotSet
  type: 18
  options:
  - None
  - Good
  - Suspicious
  - Bad
  required: false
  additionalinfo: Indicators from this integration instance will be marked with this reputation.
  section: Collect
- display: Source Reliability
  name: feedReliability
  type: 15
  required: true
  options:
  - A - Completely reliable
  - B - Usually reliable
  - C - Fairly reliable
  - D - Not usually reliable
  - E - Unreliable
  - F - Reliability cannot be judged
  defaultvalue: F - Reliability cannot be judged
  section: Collect
- display: Bypass exclusion list
  name: feedBypassExclusionList
  type: 8
  required: false
  defaultvalue: ""
  additionalinfo: When selected, the exclusion list is ignored for indicators from this feed. This means that if an indicator from this feed is on the exclusion list, the indicator might still be added to the system.
  section: Collect
- display: Add Datalake tags to indicator tags
  name: addTags
  type: 8
  required: false
  defaultvalue: 'true'
  additionalinfo: When enabled, Datalake tags are also written to the indicator "tags" field.
  section: Collect
- display: Tags
  name: feedTags
  type: 0
  additionalinfo: Supports CSV values.
  section: Collect
- display: Traffic Light Protocol Color
  name: tlp_color
  type: 15
  required: false
  options:
  - RED
  - AMBER
  - GREEN
  - WHITE
  additionalinfo: The Traffic Light Protocol (TLP) designation to apply to indicators fetched from the feed
  section: Collect
script:
  script: '-'
  type: python
  commands:
  - name: domain
    arguments:
